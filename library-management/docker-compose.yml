

services:
  # Dịch vụ Backend (API)
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: library-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    ports:
      - "5000:5000"
    volumes:
      - ./backend/public:/usr/src/app/public
    # Không còn phụ thuộc vào dịch vụ mongo cục bộ
    # depends_on:
    #   - mongo 

  # Dịch vụ Frontend (React + Nginx)
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: library-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend # Frontend vẫn phụ thuộc vào backend


